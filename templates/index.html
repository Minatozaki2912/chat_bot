<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestie POD ✨</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap");

      :root {
        --primary: #00f5d4;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", system-ui, sans-serif;
        background: linear-gradient(135deg, #0a0a0a, #1a0033);
        color: white;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      #chat-container {
        width: 100%;
        max-width: 520px;
        background: #111111;
        border-radius: 24px;
        box-shadow:
          0 20px 60px rgba(0, 245, 212, 0.15),
          0 0 0 1px rgba(0, 245, 212, 0.1) inset;
        overflow: hidden;
        border: 1px solid rgba(0, 245, 212, 0.2);
        position: relative;
      }

      .header {
        background: linear-gradient(90deg, #111111, #1a0033);
        padding: 18px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid rgba(0, 245, 212, 0.2);
      }

      .header h1 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 22px;
        font-weight: 600;
        background: linear-gradient(90deg, #00f5d4, #ff00cc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .avatar {
        width: 36px;
        height: 36px;
        background: linear-gradient(135deg, #00f5d4, #ff00cc);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        box-shadow: 0 0 15px rgba(0, 245, 212, 0.5);
      }

      #messages {
        height: 520px;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: #111111;
        scroll-behavior: smooth;
      }

      .msg-wrapper {
        display: flex;
        gap: 10px;
        max-width: 85%;
      }
      .msg-wrapper.user {
        margin-left: auto;
        flex-direction: row-reverse;
      }
      .msg-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }

      .bubble {
        padding: 14px 18px;
        border-radius: 20px;
        font-size: 15.5px;
        line-height: 1.5;
      }
      .bubble.user {
        background: linear-gradient(135deg, #00f5d4, #00c4a8);
        color: #111;
        border-bottom-right-radius: 4px;
      }
      .bubble.ai {
        background: #1f1f1f;
        border: 1px solid #333;
        border-bottom-left-radius: 4px;
      }

      .msg-images-container {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .msg-image {
        border-radius: 12px;
        max-width: 200px;
        max-height: 150px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        border: 2px solid rgba(0, 245, 212, 0.3);
      }
      /* --- TEMPLATE GALLERY STYLES --- */
      .template-gallery {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 12px;
        margin-top: 10px;
        scroll-behavior: smooth;
      }
      .template-gallery::-webkit-scrollbar {
        height: 6px;
      }
      .template-gallery::-webkit-scrollbar-thumb {
        background: rgba(0, 245, 212, 0.5);
        border-radius: 10px;
      }
      .template-card {
        flex: 0 0 280px;
        background: #1a1a1a;
        border: 1px solid rgba(0, 245, 212, 0.2);
        border-radius: 16px;
        padding: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .template-card:hover {
        border-color: #00f5d4;
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(0, 245, 212, 0.15);
      }
      .template-title {
        font-family: "Space Grotesk", sans-serif;
        color: #00f5d4;
        font-size: 14px;
        margin-bottom: 10px;
        text-align: center;
      }
      .template-images-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .template-img-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        width: 30%;
      }
      .template-img-box img {
        width: 100%;
        aspect-ratio: 1/1;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #333;
      }
      .template-img-label {
        font-size: 10px;
        color: #888;
        text-align: center;
      }
      .template-math {
        color: #666;
        font-size: 14px;
        font-weight: bold;
      }

      /* Giao diện Upload cho Template */
      .template-upload-zone {
        background: #1f1f1f;
        border: 1px dashed rgba(0, 245, 212, 0.4);
        border-radius: 12px;
        padding: 16px;
        margin-top: 12px;
        text-align: center;
      }
      .upload-boxes-container {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 12px;
      }
      .upload-box {
        flex: 1;
        background: #111;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 12px;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100px;
        position: relative;
      }
      .upload-box:hover {
        border-color: #00f5d4;
      }
      .upload-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
        border-radius: 8px;
        display: none;
      }
      .debug {
        font-size: 12px;
        background: rgba(0, 245, 212, 0.1);
        color: #00f5d4;
        padding: 6px 12px;
        border-radius: 12px;
        margin-top: 8px;
        font-family: monospace;
        border: 1px solid rgba(0, 245, 212, 0.2);
        align-self: flex-start;
      }

      .prompt-box {
        font-size: 12.5px;
        background: #181818;
        color: #ccc;
        padding: 12px;
        border-radius: 12px;
        margin-top: 8px;
        font-family: "Inter", sans-serif;
        border: 1px dashed rgba(0, 245, 212, 0.3);
        word-break: break-word;
        line-height: 1.5;
        position: relative;
      }
      .prompt-box strong {
        color: #00f5d4;
        font-family: "Space Grotesk", sans-serif;
        margin-bottom: 6px;
        display: inline-block;
      }

      .survey-box {
        background: #1a1a1a;
        border: 1px solid rgba(0, 245, 212, 0.3);
        border-radius: 16px;
        padding: 20px;
        margin-top: 8px;
        width: 100%;
        max-width: 340px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        animation: fadeIn 0.4s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .survey-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }
      .survey-header h4 {
        color: #00f5d4;
        font-size: 15px;
        font-family: "Space Grotesk", sans-serif;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .survey-dots {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .dot {
        width: 18px;
        height: 4px;
        background: #333;
        border-radius: 4px;
        transition: 0.3s;
      }
      .dot.active {
        background: #00f5d4;
        box-shadow: 0 0 8px rgba(0, 245, 212, 0.5);
      }
      .survey-step {
        display: none;
        animation: fadeIn 0.3s ease;
      }
      .survey-step.active {
        display: block;
      }
      .survey-step h5 {
        color: #fff;
        margin-bottom: 12px;
        font-weight: 500;
        font-size: 14.5px;
        line-height: 1.4;
      }
      .survey-input {
        width: 100%;
        background: #222;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 12px;
        color: white;
        font-size: 14px;
        outline: none;
        transition: all 0.2s;
      }
      .survey-input:focus {
        border-color: #00f5d4;
      }
      .survey-textarea {
        width: 100%;
        background: #222;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 12px;
        color: white;
        font-size: 14px;
        resize: none;
        outline: none;
        min-height: 80px;
      }
      .survey-textarea:focus {
        border-color: #00f5d4;
      }
      .survey-group {
        display: grid;
        gap: 8px;
      }
      .survey-group label {
        display: flex;
        align-items: center;
        background: #222;
        padding: 12px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        border: 1px solid #333;
        transition: all 0.2s;
        line-height: 1.4;
      }
      .survey-group label:hover {
        border-color: #00f5d4;
        background: #2a2a2a;
      }
      .survey-group input[type="radio"] {
        margin-right: 10px;
        accent-color: #00f5d4;
        transform: scale(1.2);
        flex-shrink: 0;
      }
      .survey-nav {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 20px;
      }
      .nav-btn {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        border: none;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
        transition: 0.2s;
      }
      .btn-back {
        background: #333;
        color: white;
      }
      .btn-back:hover {
        background: #444;
      }
      .btn-next {
        background: #e0e0e0;
        color: #111;
      }
      .btn-next:hover {
        background: #fff;
      }
      .btn-submit {
        background: linear-gradient(135deg, #00f5d4, #ff00cc);
        color: #111;
        display: none;
      }

      .btn-trigger-survey {
        background: rgba(0, 245, 212, 0.1);
        color: #00f5d4;
        border: 1px dashed #00f5d4;
        padding: 10px 16px;
        border-radius: 16px;
        cursor: pointer;
        font-size: 13.5px;
        font-family: "Inter", sans-serif;
        transition: all 0.3s;
        margin-top: 8px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn-trigger-survey:hover {
        background: rgba(0, 245, 212, 0.2);
        transform: translateY(-2px);
      }
      .inline-reply-link {
        display: inline-block;
        margin: 6px 0 0 0;
        color: #00f5d4;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 4px;
        cursor: pointer;
        font-size: 14.5px;
        font-weight: 500;
        transition: 0.2s;
        line-height: 1.5;
      }
      .inline-reply-link:hover {
        color: #ff00cc;
      }
      .inline-reply-link.disabled {
        color: #666;
        text-decoration: none;
        pointer-events: none;
      }

      .render-btn-container {
        display: flex;
        gap: 10px;
        max-width: 85%;
        margin-top: 4px;
        animation: fadeIn 0.5s ease;
      }
      .render-btn {
        background: linear-gradient(135deg, #00f5d4, #ff00cc);
        color: #111;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        border: none;
        padding: 12px 24px;
        border-radius: 16px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(0, 245, 212, 0.3);
      }
      .render-btn:hover {
        transform: scale(1.03);
        box-shadow: 0 6px 20px rgba(255, 0, 204, 0.4);
      }
      .render-btn:disabled {
        background: #333;
        color: #888;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }

      #input-area {
        padding: 16px 20px;
        background: #111111;
        border-top: 1px solid rgba(0, 245, 212, 0.2);
        display: flex;
        align-items: end;
        gap: 12px;
      }
      #msg-input {
        flex: 1;
        background: #1f1f1f;
        border: 1px solid #333;
        border-radius: 20px;
        padding: 14px 20px;
        font-size: 15px;
        outline: none;
        color: white;
        resize: none;
        max-height: 120px;
        line-height: 1.4;
      }
      #msg-input:focus {
        border-color: #00f5d4;
        box-shadow: 0 0 0 2px rgba(0, 245, 212, 0.2);
      }
      .icon-btn {
        width: 48px;
        height: 48px;
        background: #1f1f1f;
        border: 1px solid #333;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        cursor: pointer;
        transition: all 0.2s;
        flex-shrink: 0;
      }
      .icon-btn:hover {
        background: #00f5d4;
        color: #111;
        transform: scale(1.05);
      }
      .send-btn {
        background: linear-gradient(135deg, #00f5d4, #ff00cc);
        color: #111;
        font-weight: 600;
      }

      #image-preview-container {
        position: absolute;
        bottom: 80px;
        left: 20px;
        background: #1f1f1f;
        border-radius: 16px;
        padding: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        display: none;
        align-items: center;
        gap: 8px;
        max-width: 480px;
        overflow-x: auto;
        z-index: 10;
        border: 1px solid rgba(0, 245, 212, 0.2);
      }
      .preview-item {
        position: relative;
        display: inline-block;
      }
      .preview-item img {
        max-height: 100px;
        border-radius: 8px;
        border: 1px solid #444;
      }
      #messages::-webkit-scrollbar {
        width: 6px;
      }
      #messages::-webkit-scrollbar-thumb {
        background: #00f5d4;
        border-radius: 20px;
      }
      .btn-clear-preview {
        background: #ff0066;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        align-self: flex-start;
      }

      .retry-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 1000;
        display: none;
        justify-content: center;
        align-items: center;
        animation: fadeIn 0.3s ease;
      }
      .retry-modal-content {
        background: #1a1a1a;
        padding: 24px;
        border-radius: 20px;
        width: 90%;
        max-width: 450px;
        border: 1px solid #00f5d4;
        box-shadow: 0 10px 40px rgba(0, 245, 212, 0.2);
      }
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        max-height: 250px;
        overflow-y: auto;
        margin: 15px 0;
        padding-right: 5px;
      }
      .gallery-grid::-webkit-scrollbar {
        width: 6px;
      }
      .gallery-grid::-webkit-scrollbar-thumb {
        background: #00f5d4;
        border-radius: 10px;
      }
      .gallery-item {
        cursor: pointer;
        border: 3px solid transparent;
        border-radius: 10px;
        overflow: hidden;
        transition: 0.2s;
        position: relative;
      }
      .gallery-item img {
        width: 100%;
        height: 100px;
        object-fit: cover;
        display: block;
      }
      .gallery-item.selected {
        border-color: #00f5d4;
        transform: scale(0.95);
        box-shadow: 0 0 15px rgba(0, 245, 212, 0.5);
      }
      .gallery-item.selected::after {
        content: "✓";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #00f5d4;
        color: #111;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 16px;
      }
      .badge-type {
        position: absolute;
        top: 4px;
        left: 4px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid #555;
      }

      /* --- AI LOADING SCREEN TONE KEM CHUẨN UX --- */
      .ai-loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 2000;
        display: none;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(5px);
        animation: fadeIn 0.3s ease;
      }
      .ai-loading-card {
        background: #fdfbf7;
        border-radius: 24px;
        padding: 35px 25px;
        width: 90%;
        max-width: 360px;
        text-align: center;
        color: #4a3f35;
        box-shadow: 0 20px 60px rgba(0, 245, 212, 0.3);
        position: relative;
        overflow: hidden;
      }
      .ai-loading-icon {
        font-size: 70px;
        margin-bottom: 10px;
        animation: float 2s ease-in-out infinite;
        display: inline-block;
      }
      .ai-loading-title {
        font-family: "Space Grotesk", sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
        color: #5a4b3c;
        text-transform: uppercase;
      }
      .ai-loading-sub {
        font-size: 12px;
        font-weight: 600;
        color: #9c8e81;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 25px;
      }
      .progress-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 25px;
      }
      .progress-container {
        background: #eadecc;
        border-radius: 10px;
        height: 10px;
        flex: 1;
        overflow: hidden;
      }
      .progress-bar {
        background: linear-gradient(90deg, #d4a373, #e5b682);
        height: 100%;
        width: 0%;
        transition: width 0.4s ease;
        border-radius: 10px;
      }
      .progress-text {
        font-size: 12px;
        font-weight: 700;
        color: #8a7f75;
        min-width: 30px;
      }
      .loading-steps {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        font-weight: 700;
        color: #baaead;
        margin-bottom: 25px;
      }
      .loading-step {
        padding: 8px 14px;
        border-radius: 20px;
        border: 1px solid #eadecc;
        transition: all 0.3s;
      }
      .loading-step.active {
        background: #d4a373;
        color: white;
        border-color: #d4a373;
        box-shadow: 0 4px 15px rgba(212, 163, 115, 0.4);
        transform: scale(1.05);
      }
      .loading-footer {
        font-size: 12px;
        color: #b4a79c;
      }
      @keyframes float {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-12px);
        }
        100% {
          transform: translateY(0px);
        }
      }
    </style>
  </head>
  <body>
    <div id="chat-container">
      <div class="header">
        <div class="avatar">👕</div>
        <div>
          <h1>Bestie POD</h1>
          <p style="font-size: 13px; opacity: 0.7; margin-top: -2px">
            Thiết kế áo thun cùng mình nè ✨
          </p>
        </div>
        <div style="margin-left: auto">
          <button
            onclick="clearChat()"
            style="
              background: none;
              border: none;
              color: #00f5d4;
              font-size: 22px;
              cursor: pointer;
            "
            title="Làm mới bộ nhớ"
          >
            🗑️
          </button>
        </div>
      </div>

      <div id="messages"></div>

      <div id="image-preview-container">
        <div id="preview-list" style="display: flex; gap: 8px"></div>
        <button class="btn-clear-preview" onclick="removePreview()">
          ✕ Xóa ảnh
        </button>
      </div>

      <div id="input-area">
        <input
          type="file"
          id="image-upload"
          accept="image/*"
          multiple
          style="display: none"
        />
        <div class="icon-btn" onclick="triggerImageUpload()" title="Gửi ảnh">
          📸
        </div>
        <textarea
          id="msg-input"
          rows="1"
          placeholder="Kể mình nghe ý tưởng của cậu nào..."
        ></textarea>
        <div class="icon-btn send-btn" onclick="sendMessage()" title="Gửi">
          →
        </div>
      </div>
      <div id="ai-loading-overlay" class="ai-loading-overlay">
        <div class="ai-loading-card">
          <div class="ai-loading-icon">🐱🎨</div>
          <div class="ai-loading-title">AI IS CREATING FOR YOU...</div>
          <div class="ai-loading-sub" id="loading-sub">
            ĐANG PHÂN TÍCH Ý TƯỞNG...
          </div>

          <div class="progress-wrapper">
            <div class="progress-text" id="loading-percent">0%</div>
            <div class="progress-container">
              <div class="progress-bar" id="loading-progress"></div>
            </div>
          </div>

          <div class="loading-steps">
            <div class="loading-step" id="step-analyze">ANALYZE</div>
            <div>➔</div>
            <div class="loading-step" id="step-render">RENDER</div>
            <div>➔</div>

      function handleSurveyImage(input) {
        if (!input.files || input.files.length === 0) return;
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = new Image();
          img.onload = function () {
            const canvas = document.createElement("canvas");
            const MAX_WIDTH = 800;
            let width = img.width;
            let height = img.height;

            // Tính toán thu nhỏ nhưng GIỮ NGUYÊN TỶ LỆ
            if (width > MAX_WIDTH || height > MAX_WIDTH) {
              const ratio = Math.min(MAX_WIDTH / width, MAX_WIDTH / height);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }

            // TẠO CANVAS VUÔNG 1:1 ĐỂ BẢO VỆ ẢNH KHỎI BỊ AI BÓP MÉO
            const size = Math.max(width, height);
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext("2d");

            // Nền trắng để hòa làm 1 với khung
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, size, size);

            // Căn giữa ảnh gốc vào trong khung vuông
            const offsetX = (size - width) / 2;
            const offsetY = (size - height) / 2;
            ctx.drawImage(img, offsetX, offsetY, width, height);

            surveyImageBase64 = canvas.toDataURL("image/jpeg", 0.8);
            imageForNextRender = surveyImageBase64; // LƯU VÀO BIẾN BẢO LƯU

            document.getElementById("survey-img-preview").src =
              surveyImageBase64;
            document.getElementById(
              "survey-img-preview-container",
            ).style.display = "block";

            sessionGallery.push({ src: surveyImageBase64, type: "original" });
            hasUploadedImageInSession = true;
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      }

      // --- CẬP NHẬT LẤY DỮ LIỆU TỪ 2 TRƯỜNG NHẬP CHỮ RIÊNG BIỆT ---
      function submitSurvey() {
        let finalMessage = "";

        if (surveyMode === "survey") {
          finalMessage = "Mình chốt option nha:\n";
          currentDynamicSurvey.forEach((q, index) => {
            let selected = "Không chọn";
            const radios = document.getElementsByName(`surveyQ${index}`);
            radios.forEach((r) => {
              if (r.checked)
                selected =
                  r.value === "other"
                    ? document
                        .getElementById(`surveyQ${index}-other`)
                        .value.trim()
                    : r.value;
            });
            if (!selected) selected = "Không có";
            finalMessage += `- ${q.question}: ${selected}\n`;
          });

          const customName = document
            .getElementById("survey-custom-name")
            .value.trim();
          const customQuote = document
            .getElementById("survey-custom-quote")
            .value.trim();
          let textOptions = [];
          if (customName) textOptions.push(`Tên: ${customName}`);
          if (customQuote) textOptions.push(`Quote: ${customQuote}`);

          finalMessage += `- Tên hoặc Quote in thêm: ${textOptions.length > 0 ? textOptions.join(" | ") : "Không có"}\nCậu render ảnh cho mình nhé!`;
        } else if (surveyMode === "image") {
          finalMessage = "Mình muốn gửi ảnh mẫu đính kèm để làm gốc nha.\n";

            .getElementById("survey-img-details")

            .getElementById("survey-img-name")

            .getElementById("survey-img-quote")

          if (details) finalMessage += `- Chi tiết muốn thêm/sửa: ${details}\n`;
          if (customName) finalMessage += `- Tên in trên áo: "${customName}"\n`;
          if (customQuote)

          finalMessage +=
            "Cậu bám theo ảnh và yêu cầu để render cho chuẩn nhé!";

        surveyCompleted = true;
        closeSurvey();
        msgInput.value = finalMessage;
        msgInput.style.height = "auto";

      function addAIMessages(fullReply, entities = null, quickReplies = null) {
        const urlRegex = /(https?:\/\/[^\s()]+?\.(?:png|jpe?g|gif|webp))/gi;
        const foundUrls = [];

        let tempText = fullReply.replace(urlRegex, function (url) {
          foundUrls.push(url);
          return ` __IMG_${foundUrls.length - 1}__ `;
        });

        const bubbles = tempText
          .split(/([.!?\n])\s*/)
          .filter(Boolean)
          .reduce((acc, part) => {
            if (part.match(/[.!?\n]/)) {
              if (acc.length) acc[acc.length - 1] += part;
            } else if (part.trim()) {
              acc.push(part.trim());
            }
            return acc;
          }, []);

        let hasShownAvatar = false;
        bubbles.forEach((sentence) => {
          if (!sentence.trim()) return;

          let imagesForThisBubble = [];
          let cleanSentence = sentence
            .replace(/__IMG_(\d+)__/g, function (match, index) {
              imagesForThisBubble.push(foundUrls[index]);
              return "";
            })
            .trim();

          cleanSentence = cleanSentence.replace(/\*\*/g, "").trim();

          let textHtml = "";
          if (cleanSentence && !/^([.!?\n\s\-_:]+)$/.test(cleanSentence)) {
            textHtml = `<div class="bubble ai">${cleanSentence.replace(/\n/g, "<br>")}</div>`;
          }

          let imagesHtml = "";
          if (imagesForThisBubble.length > 0) {
            // Tạo một box riêng biệt, xịn xò để show các sản phẩm trơn
            imagesHtml =
              `<div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; padding: 12px; background: rgba(0, 245, 212, 0.05); border-radius: 16px; border: 1px solid rgba(0, 245, 212, 0.2);">` +
              imagesForThisBubble
                .map(
                  (url) => `
                            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                                <img src="${url}" style="max-width: 140px; height: 140px; object-fit: cover; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 2px solid transparent; transition: 0.3s;" onmouseover="this.style.borderColor='#00f5d4'" onmouseout="this.style.borderColor='transparent'">
                            </div>`,
                )
                .join("") +
              `</div>`;
          }

          if (!textHtml && !imagesHtml) return;

          const wrapper = document.createElement("div");
          wrapper.className = "msg-wrapper ai";

          wrapper.innerHTML = `
                    <div class="msg-avatar">${!hasShownAvatar ? "👕" : ""}</div>
                    <div style="width:100%;">
                        ${textHtml}
                        ${imagesHtml}
                    </div>
                `;
          messagesContainer.appendChild(wrapper);
          messagesContainer.scrollTop = messagesContainer.scrollHeight;

          hasShownAvatar = true;
        }); // <-- ĐÓNG VÒNG LẶP TẠI ĐÂY ĐỂ TRÁNH SPAM NÚT

        // KHỐI RENDER QUICK REPLIES (DẠNG LINK INLINE BÊN TRONG BUBBLE)
        if (quickReplies && quickReplies.length > 0) {
          // Tìm bong bóng chat cuối cùng của AI vừa được render
          const lastWrapper = messagesContainer.lastElementChild;
          if (lastWrapper && lastWrapper.classList.contains("ai")) {
            const lastBubble = lastWrapper.querySelector(".bubble.ai");
            if (lastBubble) {
              let linksHtml =

      function triggerImageUpload() {

      imageUploadInput.addEventListener("change", function (e) {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        currentImagesBase64 = [];
        previewList.innerHTML = "";

        // XÓA BIẾN BẢO LƯU CŨ MỖI KHI UPLOAD LÔ ẢNH MỚI
        imageForNextRender = null;

        files.forEach((file) => {
          const reader = new FileReader();
          reader.onload = function (event) {
            const img = new Image();
            img.onload = function () {
              const canvas = document.createElement("canvas");
              const MAX_WIDTH = 800;
              let width = img.width;
              let height = img.height;

              // Tính toán thu nhỏ nhưng GIỮ NGUYÊN TỶ LỆ
              if (width > MAX_WIDTH || height > MAX_WIDTH) {
                const ratio = Math.min(MAX_WIDTH / width, MAX_WIDTH / height);
                width = Math.round(width * ratio);
                height = Math.round(height * ratio);
              }

              // TẠO CANVAS VUÔNG 1:1 ĐỂ BẢO VỆ ẢNH KHỎI BỊ AI BÓP MÉO
              const size = Math.max(width, height);
              canvas.width = size;
              canvas.height = size;
              const ctx = canvas.getContext("2d");

              // Nền trắng để hòa làm 1 với khung
              ctx.fillStyle = "#FFFFFF";
              ctx.fillRect(0, 0, size, size);

              // Căn giữa ảnh gốc vào trong khung vuông
              const offsetX = (size - width) / 2;
              const offsetY = (size - height) / 2;
              ctx.drawImage(img, offsetX, offsetY, width, height);

              const b64 = canvas.toDataURL("image/jpeg", 0.8);
              currentImagesBase64.push(b64);

              // CHỈ CHỐT ẢNH ĐẦU TIÊN LÀM BASE GỐC (Tránh bị ghi đè bởi các ảnh sau)
              if (!imageForNextRender) {
                imageForNextRender = b64;
              }

              sessionGallery.push({ src: b64, type: "original" });

              previewList.innerHTML += `<div class="preview-item"><img src="${b64}"></div>`;
              imagePreviewContainer.style.display = "flex";
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        });
      });

      let loadingInterval;

      function showAILoading() {
        document.getElementById("ai-loading-overlay").style.display = "flex";
        const progressBar = document.getElementById("loading-progress");
        const percentText = document.getElementById("loading-percent");
        const subText = document.getElementById("loading-sub");
        const s1 = document.getElementById("step-analyze");
        const s2 = document.getElementById("step-render");
        const s3 = document.getElementById("step-refine");

        let progress = 0;
        s1.classList.add("active");
        s2.classList.remove("active");
        s3.classList.remove("active");
        subText.innerText = "ĐANG PHÂN TÍCH Ý TƯỞNG CỦA CẬU...";

        loadingInterval = setInterval(() => {
          // Random tiến trình để tạo cảm giác chân thực
          let step = Math.floor(Math.random() * 8) + 2;
          progress += step;
          if (progress > 94) progress = 94; // Giữ ở 94% đợi Server trả kết quả

          progressBar.style.width = progress + "%";
          percentText.innerText = progress + "%";

          if (progress > 30 && progress < 70) {
            s1.classList.remove("active");
            s2.classList.add("active");
            s3.classList.remove("active");
            subText.innerText = "ĐANG PHA MÀU VÀ ĐI NÉT...";
          } else if (progress >= 70) {
            s2.classList.remove("active");
            s3.classList.add("active");
            subText.innerText = "ĐANG TRAU CHUỐT TỪNG PIXEL...";
          }
        }, 600);
      }

        clearInterval(loadingInterval);
        document.getElementById("loading-progress").style.width = "100%";

        }, 600);

      // XỬ LÝ KHÁCH UPLOAD ẢNH VÀO TỪNG Ô (CHỦ THỂ & STYLE)
      function handleTemplateUpload(input, index) {
        if (!input.files || input.files.length === 0) return;
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = new Image();
          img.onload = function () {
            // Giữ nguyên logic nhét ảnh vào khung vuông tỷ lệ 1:1 bảo vệ AI không bị lú
            const canvas = document.createElement("canvas");
            const MAX_WIDTH = 800;
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH || height > MAX_WIDTH) {
              const ratio = Math.min(MAX_WIDTH / width, MAX_WIDTH / height);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }

            const size = Math.max(width, height);
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, size, size);

            const offsetX = (size - width) / 2;
            const offsetY = (size - height) / 2;
            ctx.drawImage(img, offsetX, offsetY, width, height);

            const b64 = canvas.toDataURL("image/jpeg", 0.8);

            // Gán ảnh vào đúng biến và hiển thị lên giao diện
            if (index === 1) {
              templateImage1 = b64;
              const preview = document.getElementById("preview-tpl-1");
              preview.src = b64;
              preview.style.display = "block";
            } else {
              templateImage2 = b64;
              const preview = document.getElementById("preview-tpl-2");
              preview.src = b64;
              preview.style.display = "block";
            }

            // Lưu vào thư viện phiên để có thể Edit/Retry sau này
            sessionGallery.push({ src: b64, type: "original" });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      }

          (item) => item.type === "generated",
        );
        if (aiImages.length === 0) {
          alert("No AI-generated images found in this session yet!");
          return;
        }

        const gallery = document.getElementById("retry-gallery");
        gallery.innerHTML = "";

        let lastAiIndex = -1;

        sessionGallery.forEach((item, index) => {
          // LỆNH LỌC: Bỏ qua ảnh gốc, chỉ hiện ảnh do AI tạo ra
          if (item.type !== "generated") return;

          lastAiIndex = index;
          const div = document.createElement("div");
          div.className = "gallery-item";
          div.setAttribute("data-index", index); // GẮN BẢNG TÊN CHÍNH XÁC VÀO ĐÂY
          div.innerHTML = `
                    <div class="badge-type">AI Drawn</div>
                    <img src="${item.src}">
                `;
          div.onclick = () => selectRetryImage(index);
          gallery.appendChild(div);
        });

        // Mặc định chọn ảnh AI gần nhất
        selectedRetryIndex = lastAiIndex;
        highlightRetrySelection();

        document.getElementById("retry-input").value = "";
        document.getElementById("retry-modal").style.display = "flex";
      }
      function selectRetryImage(index) {
        // Cập nhật: Bấm lần nữa vào ảnh đang chọn thì sẽ Hủy chọn
        if (selectedRetryIndex === index) {
          selectedRetryIndex = -1;
        } else {
          selectedRetryIndex = index;
        }
        highlightRetrySelection();
      }

      function highlightRetrySelection() {
        const items = document.querySelectorAll("#retry-gallery .gallery-item");
        items.forEach((item) => {
          // LẤY BẢNG TÊN ĐỂ SO SÁNH THAY VÌ DÙNG THỨ TỰ TRÊN MÀN HÌNH
          const itemIndex = parseInt(item.getAttribute("data-index"));
          if (itemIndex === selectedRetryIndex) {
            item.classList.add("selected");
          } else {
            item.classList.remove("selected");
          }
        });
      }

      function closeRetryModal() {
        document.getElementById("retry-modal").style.display = "none";
      }

      function submitRetry(actionType = "edit") {
        const text = document.getElementById("retry-input").value.trim();

        // Bắt lỗi nếu chọn nút Edit mà chưa chọn ảnh hoặc chưa nhập ghi chú
        if (actionType === "edit") {
          if (selectedRetryIndex === -1) {
            alert("Vui lòng chọn một ảnh AI bên trên để sửa!");
            return;
          }
          if (!text) {
            alert("Vui lòng nhập yêu cầu sửa đổi!");
            return;
          }
        }

        let selectedItem = null;
        if (selectedRetryIndex !== -1) {
          selectedItem = sessionGallery[selectedRetryIndex];
        }

        closeRetryModal();

        let finalMessage = "";
        currentImagesBase64 = [];
        lastGeneratedImageUrl = null;
        imageForNextRender = null;

        if (actionType === "edit") {
          // HÀNH ĐỘNG 1: Sửa chi tiết trên chính bức ảnh AI đã chọn
          finalMessage = `I want to EDIT DETAILS of the selected image (keep original layout/style). Request: ${text}`;

          // Lấy ảnh AI đã chọn làm ảnh tham chiếu (Image-to-Image)
          lastGeneratedImageUrl = selectedItem.src;
          imageForNextRender = selectedItem.src;
        } else if (actionType === "regenerate") {
          // HÀNH ĐỘNG 2: Bỏ qua ảnh AI, vẽ lại hoàn toàn mới dựa trên ảnh gốc của khách
          finalMessage = `I want to REGENERATE the design based on my ORIGINAL uploaded image and initial idea. Ignore the AI image we just made. Please apply these new requests: ${text ? text : "Try a different style or layout!"}`;

          // Khôi phục lại ảnh gốc do user upload từ bộ nhớ (nếu có)
          const originalImages = sessionGallery.filter(
            (item) => item.type === "original",
          );
          if (originalImages.length > 0) {
            // Lấy ảnh gốc gần nhất khách đã gửi
            const origImg = originalImages[originalImages.length - 1].src;
            currentImagesBase64.push(origImg); // Gửi kèm base64 để Backend đọc
            imageForNextRender = origImg;
          }
          // Đảm bảo xóa sạch liên kết với ảnh AI hiện tại
          lastGeneratedImageUrl = null;
        }

        msgInput.value = finalMessage;
        msgInput.style.height = "auto";
        sendMessage();
      }

      async function clearChat() {
        if (confirm("Xóa hết cuộc trò chuyện và bắt đầu ý tưởng mới?")) {
          const oldSession = sessionId;
          sessionId = `user_${Date.now()}`;

          messagesContainer.innerHTML = "";
          removePreview();
          surveyCompleted = false;
          currentDynamicSurvey = null;
          lastGeneratedImageUrl = null;
          hasUploadedImageInSession = false;
          sessionGallery = [];
          imageForNextRender = null; // Reset biến bảo lưu

          try {
            await fetch("/reset", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ session_id: oldSession }),
            });
          } catch (e) {}

          addMessage(
            "ai",
            "Hey bestie! I'm your POD design assistant ✨<br>What kind of apparel are we creating today? Tell me your ideas or drop an image!",
          );
        }
      }

      msgInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      window.onload = async function () {
        addMessage(
          "ai",
          "Hey bestie! I'm your POD design assistant ✨<br>What kind of apparel are we creating today? Tell me your ideas, drop an image, or pick a Magic Template below!",
        );

        // Kéo danh sách Template từ Backend
        try {
          const res = await fetch("/api/templates");
          const templatesData = await res.json();
          renderTemplateGallery(templatesData);
        } catch (e) {
          console.error("Lỗi tải templates:", e);
        }
      };
    </script>
  </body>
</html>
