<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestie POD ✨</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap");

      :root {
        --primary: #00f5d4;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", system-ui, sans-serif;
        background: linear-gradient(135deg, #0a0a0a, #1a0033);
        color: white;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      #chat-container {
        width: 100%;
        max-width: 520px;
        background: #111111;
        border-radius: 24px;
        box-shadow:
          0 20px 60px rgba(0, 245, 212, 0.15),
          0 0 0 1px rgba(0, 245, 212, 0.1) inset;
        overflow: hidden;
        border: 1px solid rgba(0, 245, 212, 0.2);
        position: relative;
      }

      .header {
        background: linear-gradient(90deg, #111111, #1a0033);
        padding: 18px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid rgba(0, 245, 212, 0.2);
      }

      .header h1 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 22px;
        font-weight: 600;
        background: linear-gradient(90deg, #00f5d4, #ff00cc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .avatar {
        width: 36px;
        height: 36px;
        background: linear-gradient(135deg, #00f5d4, #ff00cc);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        box-shadow: 0 0 15px rgba(0, 245, 212, 0.5);
      }

      #messages {
        height: 520px;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: #111111;
        scroll-behavior: smooth;
      }

      .msg-wrapper {
        display: flex;
        gap: 10px;
        max-width: 85%;
      }
      .msg-wrapper.user {
        margin-left: auto;
        flex-direction: row-reverse;
      }
      .msg-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }

      .bubble {
        padding: 14px 18px;
        border-radius: 20px;
        font-size: 15.5px;
        line-height: 1.5;
      }
      .bubble.user {
        background: linear-gradient(135deg, #00f5d4, #00c4a8);
        color: #111;
        border-bottom-right-radius: 4px;
      }
      .bubble.ai {
        background: #1f1f1f;
        border: 1px solid #333;
        border-bottom-left-radius: 4px;
      }

      .msg-images-container {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .msg-image {
        border-radius: 12px;
        max-width: 200px;
        max-height: 150px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        border: 2px solid rgba(0, 245, 212, 0.3);
      }
      /* --- TEMPLATE GALLERY STYLES --- */
      .template-gallery {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 12px;
        margin-top: 10px;
        scroll-behavior: smooth;
      }
      .template-gallery::-webkit-scrollbar {
        height: 6px;
      }
      .template-gallery::-webkit-scrollbar-thumb {
        background: rgba(0, 245, 212, 0.5);
        border-radius: 10px;
      }
      .template-card {
        flex: 0 0 280px;
        background: #1a1a1a;
        border: 1px solid rgba(0, 245, 212, 0.2);
        border-radius: 16px;
        padding: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .template-card:hover {
        border-color: #00f5d4;
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(0, 245, 212, 0.15);
      }
      .template-title {
        font-family: "Space Grotesk", sans-serif;
        color: #00f5d4;
        font-size: 14px;
        margin-bottom: 10px;
        text-align: center;
      }
      .template-images-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .template-img-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        width: 30%;
      }
      .template-img-box img {
        width: 100%;
        aspect-ratio: 1/1;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #333;
      }
      .template-img-label {
        font-size: 10px;
        color: #888;
        text-align: center;
      }
      .template-math {
        color: #666;
        font-size: 14px;
        font-weight: bold;
      }

      /* Giao diện Upload cho Template */
      .template-upload-zone {
        background: #1f1f1f;
        border: 1px dashed rgba(0, 245, 212, 0.4);
        border-radius: 12px;
        padding: 16px;
        margin-top: 12px;
        text-align: center;
      }
      .upload-boxes-container {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 12px;
      }
      .upload-box {
        flex: 1;
        background: #111;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 12px;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100px;
        position: relative;
      }
      .upload-box:hover {
        border-color: #00f5d4;
      }
      .upload-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
        border-radius: 8px;
        display: none;
      }
      .debug {
        font-size: 12px;
        background: rgba(0, 245, 212, 0.1);
        color: #00f5d4;
        padding: 6px 12px;
        border-radius: 12px;
        margin-top: 8px;
        font-family: monospace;
        border: 1px solid rgba(0, 245, 212, 0.2);
        align-self: flex-start;
      }

      .prompt-box {
        font-size: 12.5px;
        background: #181818;
        color: #ccc;
        padding: 12px;
        border-radius: 12px;
        margin-top: 8px;
        font-family: "Inter", sans-serif;
        border: 1px dashed rgba(0, 245, 212, 0.3);
        word-break: break-word;
        line-height: 1.5;
        position: relative;
      }
      .prompt-box strong {
        color: #00f5d4;
        font-family: "Space Grotesk", sans-serif;
        margin-bottom: 6px;
        display: inline-block;
      }

      .survey-box {
        background: #1a1a1a;
        border: 1px solid rgba(0, 245, 212, 0.3);
        border-radius: 16px;
        padding: 20px;
        margin-top: 8px;
        width: 100%;
        max-width: 340px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        animation: fadeIn 0.4s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .survey-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }
      .survey-header h4 {
        color: #00f5d4;
        font-size: 15px;
        font-family: "Space Grotesk", sans-serif;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .survey-dots {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .dot {
        width: 18px;
        height: 4px;
        background: #333;
        border-radius: 4px;
        transition: 0.3s;
      }
      .dot.active {
        background: #00f5d4;
        box-shadow: 0 0 8px rgba(0, 245, 212, 0.5);
      }
      .survey-step {
        display: none;
        animation: fadeIn 0.3s ease;
      }
      .survey-step.active {
        display: block;
      }
      .survey-step h5 {
        color: #fff;
        margin-bottom: 12px;
        font-weight: 500;
        font-size: 14.5px;
        line-height: 1.4;
      }
      .survey-input {
        width: 100%;
        background: #222;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 12px;
        color: white;
        font-size: 14px;
        outline: none;
        transition: all 0.2s;
      }
      .survey-input:focus {
        border-color: #00f5d4;
      }
      .survey-textarea {
        width: 100%;
        background: #222;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 12px;
        color: white;
        font-size: 14px;
        resize: none;
        outline: none;
        min-height: 80px;
      }
      .survey-textarea:focus {
        border-color: #00f5d4;
      }
      .survey-group {
        display: grid;
        gap: 8px;
      }
      .survey-group label {
        display: flex;
        align-items: center;
        background: #222;
        padding: 12px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        border: 1px solid #333;
        transition: all 0.2s;
        line-height: 1.4;
      }
      .survey-group label:hover {
        border-color: #00f5d4;
        background: #2a2a2a;
      }
      .survey-group input[type="radio"] {
        margin-right: 10px;
        accent-color: #00f5d4;
        transform: scale(1.2);
        flex-shrink: 0;
      }
      .survey-nav {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 20px;
      }
      .nav-btn {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        border: none;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
        transition: 0.2s;
      }
      .btn-back {
        background: #333;
        color: white;
      }
      .btn-back:hover {
        background: #444;
      }
      .btn-next {
        background: #e0e0e0;
        color: #111;
      }
      .btn-next:hover {
        background: #fff;
      }
      .btn-submit {
        background: linear-gradient(135deg, #00f5d4, #ff00cc);
        color: #111;
        display: none;
      }

      .btn-trigger-survey {
        background: rgba(0, 245, 212, 0.1);
        color: #00f5d4;
        border: 1px dashed #00f5d4;
        padding: 10px 16px;
        border-radius: 16px;
        cursor: pointer;
        font-size: 13.5px;
        font-family: "Inter", sans-serif;
        transition: all 0.3s;
        margin-top: 8px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn-trigger-survey:hover {
        background: rgba(0, 245, 212, 0.2);
        transform: translateY(-2px);
      }
      .inline-reply-link {
        display: inline-block;
        margin: 6px 0 0 0;
        color: #00f5d4;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 4px;
        cursor: pointer;
        font-size: 14.5px;
        font-weight: 500;
        transition: 0.2s;
        line-height: 1.5;
      }
      .inline-reply-link:hover {
        color: #ff00cc;
      }
      .inline-reply-link.disabled {
        color: #666;
        text-decoration: none;
        pointer-events: none;
      }

      .render-btn-container {
        display: flex;
        gap: 10px;
        max-width: 85%;
        margin-top: 4px;
        animation: fadeIn 0.5s ease;
      }
      .render-btn {
        background: linear-gradient(135deg, #00f5d4, #ff00cc);
        color: #111;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        border: none;
        padding: 12px 24px;
        border-radius: 16px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(0, 245, 212, 0.3);
      }
      .render-btn:hover {
        transform: scale(1.03);
        box-shadow: 0 6px 20px rgba(255, 0, 204, 0.4);
      }
      .render-btn:disabled {
        background: #333;
        color: #888;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }

      #input-area {
        padding: 16px 20px;
        background: #111111;
        border-top: 1px solid rgba(0, 245, 212, 0.2);
        display: flex;
        align-items: end;
        gap: 12px;
      }
      #msg-input {
        flex: 1;
        background: #1f1f1f;
        border: 1px solid #333;
        border-radius: 20px;
        padding: 14px 20px;
        font-size: 15px;
        outline: none;
        color: white;
        resize: none;
        max-height: 120px;
        line-height: 1.4;
      }
      #msg-input:focus {
        border-color: #00f5d4;
        box-shadow: 0 0 0 2px rgba(0, 245, 212, 0.2);
      }
      .icon-btn {
        width: 48px;
        height: 48px;
        background: #1f1f1f;
        border: 1px solid #333;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        cursor: pointer;
        transition: all 0.2s;
        flex-shrink: 0;
      }
      .icon-btn:hover {
        background: #00f5d4;
        color: #111;
        transform: scale(1.05);
      }
      .send-btn {
        background: linear-gradient(135deg, #00f5d4, #ff00cc);
        color: #111;
        font-weight: 600;
      }

      #image-preview-container {
        position: absolute;
        bottom: 80px;
        left: 20px;
        background: #1f1f1f;
        border-radius: 16px;
        padding: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        display: none;
        align-items: center;
        gap: 8px;
        max-width: 480px;
        overflow-x: auto;
        z-index: 10;
        border: 1px solid rgba(0, 245, 212, 0.2);
      }
      .preview-item {
        position: relative;
        display: inline-block;
      }
      .preview-item img {
        max-height: 100px;
        border-radius: 8px;
        border: 1px solid #444;
      }
      #messages::-webkit-scrollbar {
        width: 6px;
      }
      #messages::-webkit-scrollbar-thumb {
        background: #00f5d4;
        border-radius: 20px;
      }
      .btn-clear-preview {
        background: #ff0066;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        align-self: flex-start;
      }

      .retry-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 1000;
        display: none;
        justify-content: center;
        align-items: center;
        animation: fadeIn 0.3s ease;
      }
      .retry-modal-content {
        background: #1a1a1a;
        padding: 24px;
        border-radius: 20px;
        width: 90%;
        max-width: 450px;
        border: 1px solid #00f5d4;
        box-shadow: 0 10px 40px rgba(0, 245, 212, 0.2);
      }
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        max-height: 250px;
        overflow-y: auto;
        margin: 15px 0;
        padding-right: 5px;
      }
      .gallery-grid::-webkit-scrollbar {
        width: 6px;
      }
      .gallery-grid::-webkit-scrollbar-thumb {
        background: #00f5d4;
        border-radius: 10px;
      }
      .gallery-item {
        cursor: pointer;
        border: 3px solid transparent;
        border-radius: 10px;
        overflow: hidden;
        transition: 0.2s;
        position: relative;
      }
      .gallery-item img {
        width: 100%;
        height: 100px;
        object-fit: cover;
        display: block;
      }
      .gallery-item.selected {
        border-color: #00f5d4;
        transform: scale(0.95);
        box-shadow: 0 0 15px rgba(0, 245, 212, 0.5);
      }
      .gallery-item.selected::after {
        content: "✓";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #00f5d4;
        color: #111;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 16px;
      }
      .badge-type {
        position: absolute;
        top: 4px;
        left: 4px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid #555;
      }

      /* --- AI LOADING SCREEN TONE KEM CHUẨN UX --- */
      .ai-loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 2000;
        display: none;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(5px);
        animation: fadeIn 0.3s ease;
      }
      .ai-loading-card {
        background: #fdfbf7;
        border-radius: 24px;
        padding: 35px 25px;
        width: 90%;
        max-width: 360px;
        text-align: center;
        color: #4a3f35;
        box-shadow: 0 20px 60px rgba(0, 245, 212, 0.3);
        position: relative;
        overflow: hidden;
      }
      .ai-loading-icon {
        font-size: 70px;
        margin-bottom: 10px;
        animation: float 2s ease-in-out infinite;
        display: inline-block;
      }
      .ai-loading-title {
        font-family: "Space Grotesk", sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
        color: #5a4b3c;
        text-transform: uppercase;
      }
      .ai-loading-sub {
        font-size: 12px;
        font-weight: 600;
        color: #9c8e81;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 25px;
      }
      .progress-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 25px;
      }
      .progress-container {
        background: #eadecc;
        border-radius: 10px;
        height: 10px;
        flex: 1;
        overflow: hidden;
      }
      .progress-bar {
        background: linear-gradient(90deg, #d4a373, #e5b682);
        height: 100%;
        width: 0%;
        transition: width 0.4s ease;
        border-radius: 10px;
      }
      .progress-text {
        font-size: 12px;
        font-weight: 700;
        color: #8a7f75;
        min-width: 30px;
      }
      .loading-steps {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        font-weight: 700;
        color: #baaead;
        margin-bottom: 25px;
      }
      .loading-step {
        padding: 8px 14px;
        border-radius: 20px;
        border: 1px solid #eadecc;
        transition: all 0.3s;
      }
      .loading-step.active {
        background: #d4a373;
        color: white;
        border-color: #d4a373;
        box-shadow: 0 4px 15px rgba(212, 163, 115, 0.4);
        transform: scale(1.05);
      }
      .loading-footer {
        font-size: 12px;
        color: #b4a79c;
      }
      @keyframes float {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-12px);
        }
        100% {
          transform: translateY(0px);
        }
      }

      /* ===================== MOCKUP PAGE ===================== */
      #mockup-page {
        display: none;
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #0a0a0a, #1a0033);
        z-index: 1000;
        flex-direction: column;
        align-items: center;
        overflow-y: auto;
        padding: 24px 16px 40px;
      }
      #mockup-page.active {
        display: flex;
      }

      .mockup-header {
        width: 100%;
        max-width: 600px;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      .mockup-back-btn {
        background: rgba(0, 245, 212, 0.1);
        border: 1px solid rgba(0, 245, 212, 0.3);
        color: #00f5d4;
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.2s;
      }
      .mockup-back-btn:hover {
        background: rgba(0, 245, 212, 0.2);
      }
      .mockup-header h2 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 18px;
        background: linear-gradient(90deg, #00f5d4, #ff00cc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Khu vực Hiển thị chính (Preview lớn) */
      .mockup-preview-section {
        width: 100%;
        max-width: 500px;
        background: #1a1a2e;
        border: 1px solid rgba(0, 245, 212, 0.2);
        border-radius: 20px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }

      /* Cấu trúc 3 Layer khớp với Canvas render */
      .mockup-preview-wrap {
        position: relative;
        width: 100%;
        max-width: 400px;
        aspect-ratio: 1/1;
        background-color: transparent !important; /* Bắt buộc trong suốt để không bị viền vuông */
      }

      /* Lớp màu không cần thiết nữa, ẩn hoàn toàn đi */
      .preview-color-layer {
        display: none; 
      }

      /* Lớp 1: Áo đen gốc nằm dưới cùng, hiển thị bình thường */
      img.preview-base {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        mix-blend-mode: normal;
        pointer-events: none;
        z-index: 1;
      }

      /* Lớp 2: Lớp Design in lên áo. 
         Dùng SCREEN để tự động làm trong suốt nền đen của AI, chỉ giữ lại chi tiết hình vẽ */
      img.preview-design {
        position: absolute;
        object-fit: contain;
        mix-blend-mode: screen; 
        pointer-events: none;
        z-index: 2;
      }

      /* Bảng chọn màu sắc */
      .mockup-color-picker {
        display: flex;
        gap: 12px;
        justify-content: center;
        padding: 10px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 30px;
      }
      .color-swatch {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid #444;
        transition: all 0.2s;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }
      .color-swatch:hover {
        transform: scale(1.1);
      }
      .color-swatch.active {
        border-color: #00f5d4;
        transform: scale(1.15);
        box-shadow: 0 0 10px rgba(0, 245, 212, 0.5);
      }

      /* Bảng chọn loại sản phẩm */
      .mockup-products-grid {
        width: 100%;
        max-width: 600px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 20px;
      }
      @media (max-width: 500px) {
        .mockup-products-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      .mockup-product-card {
        background: #111;
        border: 1px solid #333;
        border-radius: 16px;
        padding: 12px 8px;
        cursor: pointer;
        transition: all 0.25s;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .mockup-product-card:hover,
      .mockup-product-card.selected {
        border-color: #00f5d4;
        background: rgba(0, 245, 212, 0.05);
        transform: translateY(-2px);
      }
      .mockup-product-card span {
        font-size: 13px;
        font-weight: 500;
        text-align: center;
        color: #ccc;
      }

      .mockup-download-btn {
        background: linear-gradient(135deg, #00f5d4, #ff00cc);
        color: #000;
        font-weight: 700;
        font-size: 14px;
        width: 100%;
        max-width: 400px;
        padding: 14px 28px;
        border-radius: 24px;
        border: none;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        text-align: center;
      }
      /* ===================== END MOCKUP PAGE ===================== */
      /* ===================== CHAT MINI MOCKUP ===================== */
      .chat-mini-mockup {
        position: relative;
        width: 100%;
        max-width: 260px; /* Kích thước ảnh hiển thị trong chat */
        aspect-ratio: 1/1;
        background: #f0f0f0; /* Nền xám nhạt để nổi bật chiếc áo trắng */
        border-radius: 16px;
        overflow: hidden;
        margin: 12px 0;
        border: 1px solid rgba(0, 245, 212, 0.3);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      /* Lớp dưới: Áo thun trắng */
      .chat-mini-mockup .base-shirt {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        z-index: 1;
      }

      /* Lớp trên: Thiết kế AI */
      .chat-mini-mockup .ai-design {
        position: absolute;
        /* Cập nhật lại tọa độ in cho khớp với tỷ lệ của ảnh áo đen */
        top: 32%;
        left: 38%;
        width: 26%;
        height: 26%;
        object-fit: contain;
        z-index: 2;
        /* Chuyển sang Screen để nền đen của ảnh design tự tàng hình trên áo đen */
        mix-blend-mode: screen; 
      }
    </style>
  </head>
  <body>
    <div id="chat-container">
      <div class="header">
        <div class="avatar">👕</div>
        <div>
          <h1>Bestie POD</h1>
          <p style="font-size: 13px; opacity: 0.7; margin-top: -2px">
            Thiết kế áo thun cùng mình nè ✨
          </p>
        </div>
        <div style="margin-left: auto">
          <button
            onclick="clearChat()"
            style="
              background: none;
              border: none;
              color: #00f5d4;
              font-size: 22px;
              cursor: pointer;
            "
            title="Làm mới bộ nhớ"
          >
            🗑️
          </button>
        </div>
      </div>

      <div id="messages"></div>

      <div id="image-preview-container">
        <div id="preview-list" style="display: flex; gap: 8px"></div>
        <button class="btn-clear-preview" onclick="removePreview()">
          ✕ Xóa ảnh
        </button>
      </div>

      <div id="input-area">
        <input
          type="file"
          id="image-upload"
          accept="image/*"
          multiple
          style="display: none"
        />
        <div class="icon-btn" onclick="triggerImageUpload()" title="Gửi ảnh">
          📸
        </div>
        <textarea
          id="msg-input"
          rows="1"
          placeholder="Kể mình nghe ý tưởng của cậu nào..."
        ></textarea>
        <div class="icon-btn send-btn" onclick="sendMessage()" title="Gửi">
          →
        </div>
      </div>
      <div id="ai-loading-overlay" class="ai-loading-overlay">
        <div class="ai-loading-card">
          <div class="ai-loading-icon">🐱🎨</div>
          <div class="ai-loading-title">AI IS CREATING FOR YOU...</div>
          <div class="ai-loading-sub" id="loading-sub">
            ĐANG PHÂN TÍCH Ý TƯỞNG...
          </div>

          <div class="progress-wrapper">
            <div class="progress-text" id="loading-percent">0%</div>

              <div class="progress-bar" id="loading-progress"></div>

          </div>

          <div class="loading-steps">
            <div class="loading-step" id="step-analyze">ANALYZE</div>
            <div>➔</div>
            <div class="loading-step" id="step-render">RENDER</div>
            <div>➔</div>
            <div class="loading-step" id="step-refine">REFINE</div>
          </div>

          <div class="loading-footer">✨ Powered by Bestie AI ✨</div>
        </div>
      </div>
      <div id="retry-modal" class="retry-modal">
        <div class="retry-modal-content">
          <h4
            style="
              color: #00f5d4;
              margin-bottom: 8px;
              font-family: &quot;Space Grotesk&quot;, sans-serif;
            "
          >
            🔄 Retry & Edit
          </h4>
          <p style="font-size: 13.5px; color: #aaa; line-height: 1.4">
            Select an AI-generated image below, then type your edit notes:
          </p>
          <div id="retry-gallery" class="gallery-grid"></div>
          <textarea
            id="retry-input"
            class="survey-textarea"
            placeholder="e.g: Change the shirt to black, add sunglasses..."
            style="margin-top: 10px; height: 80px"
          ></textarea>

          <div
            style="
              display: flex;
              flex-direction: column;
              gap: 10px;
              margin-top: 15px;
            "
          >
            <div style="display: flex; gap: 10px">
              <!-- Đổi thành nút Tạo lại từ ảnh gốc -->
              <button
                class="nav-btn"
                style="
                  background: #222;
                  color: #00f5d4;
                  border: 1px solid #00f5d4;
                "
                onclick="submitRetry('regenerate')"
              >
                🔄 Tạo lại từ ảnh gốc
              </button>

              <!-- Cập nhật text cho rõ ràng hơn -->
              <button
                class="nav-btn btn-submit"
                style="display: block; margin: 0"
                onclick="submitRetry('edit')"
              >
                ✍️ Sửa trên ảnh AI này
              </button>
            </div>
            <button class="nav-btn btn-back" onclick="closeRetryModal()">
              Cancel
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // --- HỆ THỐNG GIA HẠN CACHE 5 PHÚT (CACHE KEEP-ALIVE) ---
      let idleTimer;
      // Đặt 4.5 phút (270,000 ms) để an toàn bắn request trước khi Cache 5 phút của AI bị chết
      const IDLE_TIME_LIMIT = 4.5 * 60 * 1000; 

      function resetIdleTimer() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          console.log("⏳ Khách treo máy 4.5 phút. Đang nạp lại luật và gia hạn Cache...");
          fetch("/api/warmup-cache", { 
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ force_reload: true }) // Ra lệnh Backend đọc lại file
          }).catch(e => console.log("Lỗi gia hạn cache"));
          
          // Sau khi gia hạn xong, tự động thiết lập lại đồng hồ đếm ngược tiếp
          resetIdleTimer(); 
        }, IDLE_TIME_LIMIT);
      }
      // Mỗi lần load trang = 1 session mới, không bao giờ trùng
      // Dùng sessionStorage: Tab nào ID đó. Đóng tab là tự động hủy, F5 vẫn giữ nguyên.
      let sessionId = sessionStorage.getItem("sessionId");
      if (!sessionId) {
        sessionId = `session_${Date.now()}_${Math.random().toString(36).slice(2, 9)}`;
        sessionStorage.setItem("sessionId", sessionId);
      }
      let selectedTemplateId = null;
      let templateImage1 = null; // Ảnh chủ thể
      let templateImage2 = null; // Ảnh Style
      let templateImage3 = null;
      let currentImagesBase64 = [];
      let surveyCompleted = false;

      let currentDynamicSurvey = null;
      let lastGeneratedImageUrl = null;

      let surveyMode = null;
      let currentSurveyStepsArray = [];
      let currentSurveyStepIdx = 0;
      let surveyImageBase64 = null;

      let hasUploadedImageInSession = false;
      let imageForNextRender = null; // Thêm biến bảo lưu ảnh cho lúc bấm Render
      let currentSurveyCustomHint =
        "Cậu có muốn in thêm tên hay khẩu hiệu gì lên áo không? (Bỏ trống nếu không cần)";

      let sessionGallery = [];
      let selectedRetryIndex = -1;

      const messagesContainer = document.getElementById("messages");
      const msgInput = document.getElementById("msg-input");
      const imageUploadInput = document.getElementById("image-upload");
      const imagePreviewContainer = document.getElementById(
        "image-preview-container",
      );
      const previewList = document.getElementById("preview-list");

      msgInput.addEventListener("input", function () {
        this.style.height = "auto";
        this.style.height = Math.min(this.scrollHeight, 120) + "px";
      });

      // --- CẬP NHẬT GIAO DIỆN TÁCH TRƯỜNG NHẬP CHỮ TRANG CUỐI ---
      function showSurveyForm() {
        if (!currentDynamicSurvey) return;
        const triggerBtn = document.getElementById("survey-trigger-container");
        if (triggerBtn) triggerBtn.remove();
        if (document.getElementById("current-survey")) return;

        surveyMode = null;
        currentSurveyStepsArray = [];
        currentSurveyStepIdx = 0;
        surveyImageBase64 = null;

        let surveyQuestionsHtml = "";
        let totalSurveySteps = currentDynamicSurvey.length;

        // [SỬA LỖI Ở ĐÂY]: Khai báo biến quyết định ẩn/hiện trang chữ (Có bọc String để chống lỗi null)
        const showTextStep =
          currentSurveyCustomHint &&
          String(currentSurveyCustomHint).trim() !== "null";

        // Render các trang trắc nghiệm đồ họa (nếu có)
        currentDynamicSurvey.forEach((item, index) => {
          let optionsHtml = "";
          item.options.forEach((opt) => {
            optionsHtml += `<label><input type="radio" name="surveyQ${index}" value="${opt}"> ${opt}</label>`;
          });
          optionsHtml += `<label><input type="radio" name="surveyQ${index}" value="other" onchange="toggleDynamicOther(this, 'surveyQ${index}-other')"> Khác (Tự nhập)</label>
                                <input type="text" id="surveyQ${index}-other" class="survey-input" placeholder="Nhập ý tưởng của cậu..." style="display:none; margin-top: -4px; margin-bottom: 8px;">`;

          surveyQuestionsHtml += `
                    <div class="survey-step" id="step-survey-${index}">
                        <h5>${item.question}</h5>
                        <div class="survey-group">${optionsHtml}</div>
                    </div>
                `;
        });

        // TẠO TRANG CUỐI ĐỘNG: Chỉ hiện trang Quote NẾU showTextStep là true
        if (showTextStep) {
          surveyQuestionsHtml += `
                <div class="survey-step" id="step-survey-${totalSurveySteps}">
                    <h5>Bước cuối: In thêm chữ lên thiết kế? 💬</h5>
                    <p style="font-size:14px; color:#ddd; margin-bottom:12px; line-height: 1.6; background: rgba(0,245,212,0.05); padding: 12px; border-radius: 12px; border: 1px dashed rgba(0,245,212,0.3); white-space: pre-line;">${currentSurveyCustomHint}</p>
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <div>
                            <label style="font-size: 13px; color: #ddd; margin-bottom: 6px; display: block;">Câu Quote/Slogan (bỏ trống nếu không cần):</label>
                            <input type="text" id="survey-custom-quote" class="survey-input" placeholder="VD: Nhập quote AI gợi ý ở trên (hoặc tự thay tên bạn vào)...">
                        </div>
                    </div>
                </div>
            `;
          totalSurveySteps++;
        }

        let stepChoiceHtml = "";
        // Bỏ qua màn hình chọn nút nếu mảng rỗng (Chỉ có bước Text)
        if (currentDynamicSurvey.length > 0) {
          stepChoiceHtml = `
                <div class="survey-step active" id="step-choice">
                    <h5 style="text-align:center; margin-bottom: 16px;">Cậu muốn lên ý tưởng theo cách nào?</h5>
                    <div style="display:flex; flex-direction:column; gap:10px;">
                        <button class="render-btn" style="width:100%; font-size:14px; padding:12px;" onclick="startSurveyMode('survey')">📝 Trả lời trắc nghiệm (AI gợi ý)</button>
                        <button class="btn-trigger-survey" style="width:100%; justify-content:center; font-size:14px; padding:12px;" onclick="startSurveyMode('image')">🖼️ Gửi ảnh mẫu + Mô tả</button>
                    </div>
                </div>
            `;
        }

        // Tự động nhảy thẳng vào Survey nếu đã có ảnh hoặc Survey rỗng
        if (hasUploadedImageInSession || currentDynamicSurvey.length === 0) {
          stepChoiceHtml = "";
          surveyMode = "survey";
        }

        const wrapper = document.createElement("div");
        wrapper.className = "msg-wrapper ai";
        wrapper.innerHTML = `
                <div class="msg-avatar">👕</div>
                <div>
                    <div class="survey-box" id="current-survey">
                        <div class="survey-header">
                            <h4>✨ ${currentDynamicSurvey.length > 0 ? "Lên ý tưởng thiết kế" : "Chốt nội dung in áo"}</h4>
                            <button onclick="closeSurvey()" style="background:none; border:none; color:#666; font-size:18px; cursor:pointer;">✕</button>
                        </div>
                        <div class="survey-dots" id="survey-dots" style="display:none;"></div>
                        ${stepChoiceHtml}
                        ${surveyQuestionsHtml}

                        <div class="survey-step" id="step-image-0">
                            <h5>1. Tải ảnh mẫu của cậu lên nha 🖼️</h5>
                            <input type="file" id="survey-img-upload" accept="image/*" style="display:none;" onchange="handleSurveyImage(this)">
                            <button class="btn-trigger-survey" style="width:100%; justify-content:center; margin-bottom:10px; padding:12px;" onclick="document.getElementById('survey-img-upload').click()">+ Chọn ảnh từ máy tính/điện thoại</button>
                            <div id="survey-img-preview-container" style="display:none; text-align:center;">
                                <img id="survey-img-preview" style="max-height:120px; border-radius:8px; border:1px solid #444;">
                                <button style="display:block; margin: 8px auto 0; background:none; color:#ff0066; border:none; cursor:pointer; font-size:13px;" onclick="clearSurveyImage()">✕ Xóa ảnh</button>
                            </div>
                        </div>
                        <div class="survey-step" id="step-image-1">
                            <h5>2. Chi tiết cậu muốn thêm/sửa? ✍️</h5>
                            <textarea id="survey-img-details" class="survey-textarea" placeholder="Nhập yêu cầu của cậu..."></textarea>
                        </div>
                        ${
                          showTextStep
                            ? `
                        <div class="survey-step" id="step-image-2">
                            <h5>3. In thêm chữ lên thiết kế? 💬</h5>
                            <p style="font-size:14px; color:#ddd; margin-bottom:12px; line-height: 1.6; background: rgba(0,245,212,0.05); padding: 12px; border-radius: 12px; border: 1px dashed rgba(0,245,212,0.3); white-space: pre-line;">${currentSurveyCustomHint}</p>
                            <div style="display: flex; flex-direction: column; gap: 12px;">
                                <div>
                                    <label style="font-size: 13px; color: #ddd; margin-bottom: 6px; display: block;">Câu Quote/Slogan (bỏ trống nếu không cần):</label>
                                    <input type="text" id="survey-img-quote" class="survey-input" placeholder="VD: Nhập quote AI gợi ý ở trên (hoặc tự thay tên bạn vào)...">
                                </div>
                            </div>
                        </div>
                        `
                            : ""
                        }

                        <div class="survey-nav" id="survey-nav" style="display:none;">
                            <button class="nav-btn btn-back" id="btn-back" onclick="changeSurveyStep(-1)" style="display:none;">Back</button>
                            <button class="nav-btn btn-next" id="btn-next" onclick="changeSurveyStep(1)">Next ➔</button>
                            <button class="nav-btn btn-submit" id="btn-submit" onclick="submitSurvey()" style="display:none;">Hoàn thành 🚀</button>
                        </div>
                    </div>
                </div>
            `;
        messagesContainer.appendChild(wrapper);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        if (surveyMode === "survey") {
          for (let i = 0; i < totalSurveySteps; i++) {
            currentSurveyStepsArray.push("step-survey-" + i);
          }
          let dotsHtml = "";
          for (let i = 0; i < currentSurveyStepsArray.length; i++) {
            dotsHtml += `<div class="dot ${i === 0 ? "active" : ""}" id="dot${i}"></div>`;
          }
          document.getElementById("survey-dots").innerHTML = dotsHtml;
          document.getElementById("survey-dots").style.display = "flex";
          document.getElementById("survey-nav").style.display = "flex";

          if (currentSurveyStepsArray.length > 0) {
            document
              .getElementById(currentSurveyStepsArray[0])
              .classList.add("active");
          }
          updateSurveyNavButtons();
        }
      }

      function toggleDynamicOther(radioEl, inputId) {
        const inputField = document.getElementById(inputId);
        const allRadios = document.getElementsByName(radioEl.name);
        let isOther = false;
        allRadios.forEach((r) => {
          if (r.checked && r.value === "other") isOther = true;
        });
        inputField.style.display = isOther ? "block" : "none";
        if (isOther) inputField.focus();
      }

      function startSurveyMode(mode) {
        surveyMode = mode;
        document.getElementById("step-choice").classList.remove("active");
        document.getElementById("survey-nav").style.display = "flex";
        document.getElementById("survey-dots").style.display = "flex";

        currentSurveyStepIdx = 0;
        currentSurveyStepsArray = [];

        // [SỬA LỖI Ở ĐÂY]: Dùng String() để bảo vệ khỏi lỗi crash
        const showTextStep =
          currentSurveyCustomHint &&
          String(currentSurveyCustomHint).trim() !== "null";

        if (mode === "survey") {
          // Nhánh Trắc nghiệm
          const totalSteps =
            currentDynamicSurvey.length + (showTextStep ? 1 : 0);
          for (let i = 0; i < totalSteps; i++) {
            currentSurveyStepsArray.push("step-survey-" + i);
          }
        } else {
          // Nhánh Tải ảnh
          currentSurveyStepsArray = ["step-image-0", "step-image-1"];
          if (showTextStep) {
            currentSurveyStepsArray.push("step-image-2");
          }
        }

        let dotsHtml = "";
        for (let i = 0; i < currentSurveyStepsArray.length; i++) {
          dotsHtml += `<div class="dot ${i === 0 ? "active" : ""}" id="dot${i}"></div>`;
        }
        document.getElementById("survey-dots").innerHTML = dotsHtml;

        document
          .getElementById(currentSurveyStepsArray[0])
          .classList.add("active");
        updateSurveyNavButtons();
      }

      function updateSurveyNavButtons() {
        document.getElementById("btn-back").style.display =
          currentSurveyStepIdx > 0 ? "block" : "none";
        if (currentSurveyStepIdx === currentSurveyStepsArray.length - 1) {
          document.getElementById("btn-next").style.display = "none";
          document.getElementById("btn-submit").style.display = "block";
        } else {
          document.getElementById("btn-next").style.display = "block";
          document.getElementById("btn-submit").style.display = "none";
        }
      }

      function changeSurveyStep(dir) {
        document
          .getElementById(currentSurveyStepsArray[currentSurveyStepIdx])
          .classList.remove("active");
        document
          .getElementById("dot" + currentSurveyStepIdx)
          .classList.remove("active");

        currentSurveyStepIdx += dir;

        document
          .getElementById(currentSurveyStepsArray[currentSurveyStepIdx])
          .classList.add("active");
        document
          .getElementById("dot" + currentSurveyStepIdx)
          .classList.add("active");
        updateSurveyNavButtons();
      }

      function handleSurveyImage(input) {
        if (!input.files || input.files.length === 0) return;
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = new Image();
          img.onload = function () {
            const canvas = document.createElement("canvas");
            const MAX_WIDTH = 800;
            let width = img.width;
            let height = img.height;

            // Tính toán thu nhỏ nhưng GIỮ NGUYÊN TỶ LỆ
            if (width > MAX_WIDTH || height > MAX_WIDTH) {
              const ratio = Math.min(MAX_WIDTH / width, MAX_WIDTH / height);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }

            // Giữ nguyên tỷ lệ, không pad thêm viền
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            surveyImageBase64 = canvas.toDataURL("image/jpeg", 0.9);
            imageForNextRender = surveyImageBase64; // LƯU VÀO BIẾN BẢO LƯU

            document.getElementById("survey-img-preview").src =
              surveyImageBase64;
            document.getElementById(
              "survey-img-preview-container",
            ).style.display = "block";

      function submitSurvey() {
        let finalMessage = "";

        if (surveyMode === "survey") {
          finalMessage = "Mình chốt option nha:\n";
          currentDynamicSurvey.forEach((q, index) => {
            let selected = "Không chọn";
            const radios = document.getElementsByName(`surveyQ${index}`);
            radios.forEach((r) => {
              if (r.checked)
                selected =
                  r.value === "other"
                    ? document
                        .getElementById(`surveyQ${index}-other`)
                        .value.trim()
                    : r.value;
            });
            if (!selected) selected = "Không có";
            finalMessage += `- ${q.question}: ${selected}\n`;
          });

          // Chỉ lấy Quote
          const quoteEl = document.getElementById("survey-custom-quote");
          const customQuote = quoteEl ? quoteEl.value.trim() : "";

          if (customQuote) {
            finalMessage += `- Quote in thêm: ${customQuote}\n`;
          } else {
            finalMessage += `- Quote in thêm: Không có\n`;
          }
          finalMessage += "Cậu render ảnh cho mình nhé!";
        } else if (surveyMode === "image") {
          finalMessage = "Mình muốn gửi ảnh mẫu đính kèm để làm gốc nha.\n";

          const detailsEl = document.getElementById("survey-img-details");
          const customQuoteEl = document.getElementById("survey-img-quote");

          const details = detailsEl ? detailsEl.value.trim() : "";
          const customQuote = customQuoteEl ? customQuoteEl.value.trim() : "";

          if (details) finalMessage += `- Chi tiết muốn thêm/sửa: ${details}\n`;

      function addAIMessages(fullReply, entities = null, quickReplies = null) {
        const urlRegex = /(https?:\/\/[^\s()]+?\.(?:png|jpe?g|gif|webp))/gi;
        const foundUrls = [];

        let tempText = fullReply.replace(urlRegex, function (url) {
          foundUrls.push(url);
          return ` __IMG_${foundUrls.length - 1}__ `;
        });

        const bubbles = tempText
          .split(/([.!?\n])\s*/)
          .filter(Boolean)
          .reduce((acc, part) => {
            if (part.match(/[.!?\n]/)) {
              if (acc.length) acc[acc.length - 1] += part;
            } else if (part.trim()) {
              acc.push(part.trim());
            }
            return acc;
          }, []);

        let hasShownAvatar = false;
        bubbles.forEach((sentence) => {
          if (!sentence.trim()) return;

          let imagesForThisBubble = [];
          let cleanSentence = sentence
            .replace(/__IMG_(\d+)__/g, function (match, index) {
              imagesForThisBubble.push(foundUrls[index]);
              return "";
            })
            .trim();

          cleanSentence = cleanSentence.replace(/\*\*/g, "").trim();

          let textHtml = "";
          if (cleanSentence && !/^([.!?\n\s\-_:]+)$/.test(cleanSentence)) {
            textHtml = `<div class="bubble ai">${cleanSentence.replace(/\n/g, "<br>")}</div>`;
          }

          let imagesHtml = "";
          if (imagesForThisBubble.length > 0) {
            // Tạo một box riêng biệt, xịn xò để show các sản phẩm trơn
            imagesHtml =
              `<div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; padding: 12px; background: rgba(0, 245, 212, 0.05); border-radius: 16px; border: 1px solid rgba(0, 245, 212, 0.2);">` +
              imagesForThisBubble
                .map(
                  (url) => `
                            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                                <img src="${url}" style="max-width: 140px; height: 140px; object-fit: cover; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 2px solid transparent; transition: 0.3s;" onmouseover="this.style.borderColor='#00f5d4'" onmouseout="this.style.borderColor='transparent'">
                            </div>`,
                )
                .join("") +
              `</div>`;
          }

          if (!textHtml && !imagesHtml) return;

          const wrapper = document.createElement("div");
          wrapper.className = "msg-wrapper ai";

          wrapper.innerHTML = `
                    <div class="msg-avatar">${!hasShownAvatar ? "👕" : ""}</div>
                    <div style="width:100%;">
                        ${textHtml}
                        ${imagesHtml}
                    </div>
                `;
          messagesContainer.appendChild(wrapper);
          messagesContainer.scrollTop = messagesContainer.scrollHeight;

          hasShownAvatar = true;
        }); // <-- ĐÓNG VÒNG LẶP TẠI ĐÂY ĐỂ TRÁNH SPAM NÚT

        // KHỐI RENDER QUICK REPLIES (DẠNG LINK INLINE BÊN TRONG BUBBLE)
        // KHỐI RENDER QUICK REPLIES (NÚT SHORT TEXT NHƯNG TRUYỀN FULL TEXT VÀ CÓ MÀU SẮC ĐỘNG)
        if (quickReplies && quickReplies.length > 0) {
          const lastWrapper = messagesContainer.lastElementChild;
          if (lastWrapper && lastWrapper.classList.contains("ai")) {
            const lastBubble = lastWrapper.querySelector(".bubble.ai");
            if (lastBubble) {
              let linksHtml =
                '<div style="margin-top: 14px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.1);">';
              linksHtml += quickReplies
                .map((reply) => {
                  let displayText = "";
                  let actionText = "";
                  let color = "#00f5d4"; // Màu mặc định nếu lỗi hoặc thiếu thông tin

                  // Đọc chuẩn cấu trúc Object động mới
                  if (typeof reply === "object" && reply !== null) {
                    if (reply.short_label && reply.full_text) {
                      displayText = reply.short_label; // Text ngắn kèm icon hiện trên nút
                      actionText = reply.full_text; // Full text chi tiết gửi lên AI
                      color = reply.color || "#00f5d4"; // Màu sắc viền theo vibe
                    } else if (reply.text) {
                      displayText = reply.text;
                      actionText = reply.text;
                      color = reply.color || "#00f5d4";
                    }
                  } else {
                    displayText = reply;
                    actionText = reply;
                  }

                  // Mã hóa ký tự nháy đơn/nháy kép để tránh vỡ HTML khi truyền qua onclick
                  const safeActionText = actionText
                    .replace(/'/g, "\\'")
                    .replace(/"/g, "&quot;");

                  // Trả về thiết kế nút Pill bo tròn đổi màu linh hoạt, hover sáng nhẹ 10% nền (color + '1A')
                  return `
                    <button class="inline-reply-btn" 
                            style="display: block; width: 100%; text-align: left; background: transparent; border: 1px solid ${color}; color: ${color}; border-radius: 20px; padding: 12px 16px; margin-top: 8px; cursor: pointer; font-size: 14px; font-weight: 500; line-height: 1.4; transition: all 0.3s;" 
                            onmouseover="this.style.backgroundColor='${color}1A'; this.style.transform='translateY(-2px)'" 
                            onmouseout="this.style.backgroundColor='transparent'; this.style.transform='translateY(0)'" 
                            onclick="sendQuickReply(this, '${safeActionText}')">
                        ${displayText}
                    </button>`;
                })
                .join("");
              linksHtml += "</div>";

              lastBubble.innerHTML += linksHtml;
              messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
          }
        }
      }

      imageUploadInput.addEventListener("change", function (e) {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        currentImagesBase64 = [];
        previewList.innerHTML = "";

        // XÓA BIẾN BẢO LƯU CŨ MỖI KHI UPLOAD LÔ ẢNH MỚI
        imageForNextRender = null;

        files.forEach((file) => {
          const reader = new FileReader();
          reader.onload = function (event) {
            const img = new Image();
            img.onload = function () {
              const canvas = document.createElement("canvas");
              const MAX_WIDTH = 800;
              let width = img.width;
              let height = img.height;

              // Tính toán thu nhỏ nhưng GIỮ NGUYÊN TỶ LỆ
              if (width > MAX_WIDTH || height > MAX_WIDTH) {
                const ratio = Math.min(MAX_WIDTH / width, MAX_WIDTH / height);
                width = Math.round(width * ratio);
                height = Math.round(height * ratio);
              }

              // Giữ nguyên tỷ lệ, không pad thêm viền
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);

              const b64 = canvas.toDataURL("image/jpeg", 0.9);
              currentImagesBase64.push(b64);

              // CHỈ CHỐT ẢNH ĐẦU TIÊN LÀM BASE GỐC (Tránh bị ghi đè bởi các ảnh sau)
              if (!imageForNextRender) {
                imageForNextRender = b64;
              }

              sessionGallery.push({ src: b64, type: "original" });

              previewList.innerHTML += `<div class="preview-item"><img src="${b64}"></div>`;
              imagePreviewContainer.style.display = "flex";
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        });
      });

      let loadingInterval;

      function showAILoading() {
        document.getElementById("ai-loading-overlay").style.display = "flex";
        const progressBar = document.getElementById("loading-progress");
        const percentText = document.getElementById("loading-percent");
        const subText = document.getElementById("loading-sub");
        const s1 = document.getElementById("step-analyze");
        const s2 = document.getElementById("step-render");
        const s3 = document.getElementById("step-refine");

        let progress = 0;
        s1.classList.add("active");
        s2.classList.remove("active");
        s3.classList.remove("active");
        subText.innerText = "ĐANG PHÂN TÍCH Ý TƯỞNG CỦA CẬU...";

        loadingInterval = setInterval(() => {
          // Random tiến trình để tạo cảm giác chân thực
          let step = Math.floor(Math.random() * 8) + 2;
          progress += step;
          if (progress > 94) progress = 94; // Giữ ở 94% đợi Server trả kết quả

          progressBar.style.width = progress + "%";
          percentText.innerText = progress + "%";

          if (progress > 30 && progress < 70) {
            s1.classList.remove("active");
            s2.classList.add("active");
            s3.classList.remove("active");
            subText.innerText = "ĐANG PHA MÀU VÀ ĐI NÉT...";
          } else if (progress >= 70) {
            s2.classList.remove("active");
            s3.classList.add("active");
            subText.innerText = "ĐANG TRAU CHUỐT TỪNG PIXEL...";
          }
        }, 600);
      }

      function hideAILoading() {
        clearInterval(loadingInterval);
        document.getElementById("loading-progress").style.width = "100%";
        document.getElementById("loading-percent").innerText = "100%";
        document.getElementById("loading-sub").innerText = "HOÀN TẤT!";

        setTimeout(() => {
          document.getElementById("ai-loading-overlay").style.display = "none";
          document.getElementById("loading-progress").style.width = "0%";
          document.getElementById("loading-percent").innerText = "0%";
        }, 600);
      }

      // XỬ LÝ KHÁCH UPLOAD ẢNH VÀO TỪNG Ô (CHỦ THỂ & STYLE)
      function handleTemplateUpload(input, index) {
        if (!input.files || input.files.length === 0) return;
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = new Image();
          img.onload = function () {
            // Giữ nguyên tỷ lệ, không pad thêm viền
            const canvas = document.createElement("canvas");
            const MAX_WIDTH = 800;
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH || height > MAX_WIDTH) {
              const ratio = Math.min(MAX_WIDTH / width, MAX_WIDTH / height);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            const b64 = canvas.toDataURL("image/jpeg", 0.9);

            // Gán ảnh vào đúng biến và hiển thị lên giao diện
            if (index === 1) {
              templateImage1 = b64;
            } else if (index === 2) {
              templateImage2 = b64;
            } else if (index === 3) {
              templateImage3 = b64;
            }

            const preview = document.getElementById(`preview-tpl-${index}`);
            if (preview) {
              preview.src = b64;
              preview.style.display = "block";
            }

            // Lưu vào thư viện phiên để có thể Edit/Retry sau này
            sessionGallery.push({ src: b64, type: "original" });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      }

          const div = document.createElement("div");
          div.className = "gallery-item";
          div.setAttribute("data-index", index); // GẮN BẢNG TÊN CHÍNH XÁC VÀO ĐÂY
          div.innerHTML = `
                    <div class="badge-type">AI Drawn</div>
                    <img src="${item.src}">
                `;
          div.onclick = () => selectRetryImage(index);
          gallery.appendChild(div);
        });

        // Mặc định chọn ảnh AI gần nhất
        selectedRetryIndex = lastAiIndex;
        highlightRetrySelection();

        document.getElementById("retry-input").value = "";
        document.getElementById("retry-modal").style.display = "flex";
      }
      function selectRetryImage(index) {
        // Cập nhật: Bấm lần nữa vào ảnh đang chọn thì sẽ Hủy chọn
        if (selectedRetryIndex === index) {
          selectedRetryIndex = -1;
        } else {
          selectedRetryIndex = index;
        }
        highlightRetrySelection();
      }

      function highlightRetrySelection() {
        const items = document.querySelectorAll("#retry-gallery .gallery-item");
        items.forEach((item) => {
          // LẤY BẢNG TÊN ĐỂ SO SÁNH THAY VÌ DÙNG THỨ TỰ TRÊN MÀN HÌNH
          const itemIndex = parseInt(item.getAttribute("data-index"));
          if (itemIndex === selectedRetryIndex) {
            item.classList.add("selected");
          } else {
            item.classList.remove("selected");
          }
        });
      }

      function closeRetryModal() {
        document.getElementById("retry-modal").style.display = "none";
      }

      function submitRetry(actionType = "edit") {
        const text = document.getElementById("retry-input").value.trim();

        if (actionType === "edit") {
          if (selectedRetryIndex === -1) {
            alert("Vui lòng chọn một ảnh AI bên trên để sửa!");
            return;
          }
          if (!text) {
            alert("Vui lòng nhập yêu cầu sửa đổi!");
            return;
          }
        }

        let selectedItem = null;
        if (selectedRetryIndex !== -1) {
          selectedItem = sessionGallery[selectedRetryIndex];
        }

        closeRetryModal();

        if (actionType === "edit" && selectedItem) {
          // === SỬA ẢNH QUA LUẬT PROMPT → /retry-image ===
          // Flow: AI đọc lại SYSTEM_PROMPT + luật + context → sinh master_prompt mới → gọi /images/edits
          showAILoading();

          fetch("/retry-image", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              retry_instruction: text, // Yêu cầu sửa thuần của khách
              preview_image_url: selectedItem.src, // URL ảnh preview hiện tại
              session_id: sessionId, // Để AI đọc được context hội thoại
              template_id: selectedTemplateId || null,
            }),
          })
            .then((res) => res.json())
            .then((data) => {
              hideAILoading();
              if (data.image_url) {
                lastGeneratedImageUrl = data.image_url;
                sessionGallery.push({ src: data.image_url, type: "generated" });

                const wrapper = document.createElement("div");
                wrapper.className = "msg-wrapper ai";
                wrapper.innerHTML = `
                    <div class="msg-avatar">👕</div>
                    <div style="width: 100%;">
                        <div class="bubble ai">Đã sửa theo yêu cầu của cậu rồi nè! 👍</div>
                        
                        <div style="display: flex; flex-direction: column; gap: 24px; margin-top: 16px; margin-bottom: 16px; align-items: center;">
                            
                            <div style="width: 100%; max-width: 300px;">
                                <div style="font-size: 11px; color: #00f5d4; margin-bottom: 8px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; text-align: center;">👕 Lên áo thử</div>
                                <div class="chat-mini-mockup" style="margin: 0 auto; width: 100%; max-width: 100%;">
                                    <img class="base-shirt" src="https://i.postimg.cc/t4s1rDLc/b5e4dc99-4b69-4a96-b492-40263ecddf31.png">
                                    <img class="ai-design" src="${data.image_url}">
                                </div>
                            </div>

                            <div style="width: 60%; height: 1px; background: rgba(0, 245, 212, 0.2);"></div>
                            
                            <div style="width: 100%; max-width: 450px;">
                                <div style="font-size: 11px; color: #00f5d4; margin-bottom: 8px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; text-align: center;">🎨 Bản nét (Click chuột phải tải về)</div>
                                <img src="${data.image_url}" alt="Edited AI Generated" style="width: 100%; height: auto; aspect-ratio: 1/1; object-fit: contain; border-radius: 16px; margin: 0 auto; display: block; background: white; border: 1px solid rgba(0, 245, 212, 0.3); box-shadow: 0 8px 25px rgba(0,0,0,0.2);">
                            </div>
                            
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px;">
                            <button class="render-btn" style="width: 100%; background: linear-gradient(135deg, #00f5d4, #00c4a8);" onclick="triggerFinalRender(this, '${btoa(unescape(encodeURIComponent(text)))}', '${data.image_url}')">
                                ✅ Chốt ảnh này & Tạo bản in nét
                            </button>
                            <button class="render-btn" style="width: 100%; background: linear-gradient(135deg, #ff00cc, #7b00ff);" onclick="openMockupPage('${data.image_url}')">
    🛒 Add to cart
</button>
                            <button class="btn-trigger-survey" style="width: 100%; justify-content: center;" onclick="openRetryModal()">
                                🔄 Sửa tiếp
                            </button>
                        </div>
                    </div>
                `;
                messagesContainer.appendChild(wrapper);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
              } else {
                addMessage(
                  "ai",
                  `Lỗi khi sửa ảnh: ${data.error || "Không xác định"}`,
                );
              }
            })
            .catch((err) => {
              hideAILoading();
              console.error(err);
              addMessage("ai", "Lỗi kết nối khi retry.");
            });
        } else if (actionType === "regenerate") {
          // Tạo lại từ ảnh gốc (giữ logic cũ)
          let finalMessage = `I want to REGENERATE the design based on my ORIGINAL uploaded image. New request: ${text || "Try different style"}`;

          const originalImages = sessionGallery.filter(
            (item) => item.type === "original",
          );
          if (originalImages.length > 0) {
            currentImagesBase64 = [
              originalImages[originalImages.length - 1].src,
            ];
            imageForNextRender = currentImagesBase64[0];
          }

          msgInput.value = finalMessage;
          sendMessage();
        }
      }

      // SỬA
      async function clearChat() {
        if (confirm("Xóa hết cuộc trò chuyện và bắt đầu ý tưởng mới?")) {
          // Không tạo session mới — giữ nguyên sessionId
          messagesContainer.innerHTML = "";
          removePreview();
          surveyCompleted = false;
          currentDynamicSurvey = null;
          lastGeneratedImageUrl = null;
          hasUploadedImageInSession = false;
          sessionGallery = [];
          imageForNextRender = null;

          try {
            await fetch("/reset", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ session_id: sessionId }),  // session cũ, chỉ xóa history
            });
          } catch (e) {}

          addMessage("ai", "Hey bestie! I'm your POD design assistant ✨<br>What kind of apparel are we creating today? Tell me your ideas or drop an image!");
        }
      }
      msgInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      window.onload = async function () {
        // Khởi động đồng hồ đếm ngược và mồi cache lần đầu
        fetch("/api/warmup-cache", { method: "POST" }).catch(e => console.log("Warmup skipped"));
        resetIdleTimer();
        // [CẬP NHẬT MỚI]: Bắn tín hiệu ngầm báo Backend mồi Prompt Caching ngay lập tức
        fetch("/api/warmup-cache", { method: "POST" }).catch(e => console.log("Warmup skipped"));

        // Xóa history chat cũ trên server (F5 hoặc reload) — giữ nguyên sessionId
        try {
          await fetch("/reset", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: sessionId }),
          });
        } catch (e) {}

        addMessage(
          "ai",
          "Hey bestie! I'm your POD design assistant ✨<br>What kind of apparel are we creating today? Tell me your ideas, drop an image, or pick a Magic Template below!",
        );

        // Kéo danh sách Template từ Backend
        try {
          const res = await fetch("/api/templates");
          const templatesData = await res.json();
          renderTemplateGallery(templatesData);
        } catch (e) {
          console.error("Lỗi tải templates:", e);
        }
      };

      // ===================== MOCKUP PAGE LOGIC =====================
      let MOCKUP_PRODUCTS = [];
      let currentMockupDesignUrl = null;
      let activeProduct = null;
      let currentBgColor = { hex: "#111111", r: 17, g: 17, b: 17 }; // màu nền detect từ design

      async function loadMockupProducts() {
        if (MOCKUP_PRODUCTS.length > 0) return;
        try {
          const res = await fetch("/api/mockups");
          MOCKUP_PRODUCTS = await res.json();
        } catch (e) {
          console.error("Lỗi tải mockups.json:", e);
        }
      }

      async function openMockupPage(designUrl) {
        currentMockupDesignUrl = designUrl;
        await loadMockupProducts();

        // Detect màu nền của design → dùng để tint sản phẩm
        currentBgColor = { hex: "#111111", r: 17, g: 17, b: 17 }; // default đen
        try {
          const bgRes = await fetch("/api/design-bg-color", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ image_url: designUrl }),
          });
          if (bgRes.ok) {
            const bgData = await bgRes.json();
            if (bgData.hex) {
              currentBgColor = bgData;
              console.log("🎨 Design BG color:", bgData.hex);
            }
          }
        } catch (e) {
          console.warn("Không detect được màu nền, dùng màu mặc định.", e);
        }

        document.getElementById("mockup-page").classList.add("active");

        // Render lưới sản phẩm bên dưới
        renderMockupProductsGrid();

        // Chọn mặc định sản phẩm đầu tiên
        if (MOCKUP_PRODUCTS.length > 0) {
          selectMockupProduct(MOCKUP_PRODUCTS[0]);
        }
        window.scrollTo(0, 0);
      }

      function closeMockupPage() {
        document.getElementById("mockup-page").classList.remove("active");
      }

      // Render danh sách icon sản phẩm
      function renderMockupProductsGrid() {
        const grid = document.getElementById("mockup-grid");
        grid.innerHTML = "";
        MOCKUP_PRODUCTS.forEach((product) => {
          const card = document.createElement("div");
          card.className = "mockup-product-card";
          card.id = "prod-card-" + product.id;
          card.onclick = () => selectMockupProduct(product);
          card.innerHTML = `
            <span style="font-size: 28px;">${product.emoji}</span>
            <span>${product.name}</span>
          `;
          grid.appendChild(card);
        });
      }
      function selectMockupProduct(product) {
        activeProduct = product;

        // Đổi UI trạng thái selected
        document.querySelectorAll(".mockup-product-card").forEach((c) => c.classList.remove("selected"));
        document.getElementById("prod-card-" + product.id).classList.add("selected");
        document.getElementById("mockup-preview-title").textContent = product.emoji + " " + product.name;

        // 1. Load áo gốc
        const baseEl = document.getElementById("mockup-preview-base");
        if (baseEl) {
            baseEl.crossOrigin = "anonymous";
            baseEl.src = activeProduct.base;
        }

        // 2. Load Design (CSS screen sẽ lo phần khử viền đen)
        const designEl = document.getElementById("mockup-preview-design");
        if (designEl) {
            designEl.src = currentMockupDesignUrl;
            designEl.style.top = activeProduct.printArea.top;
            designEl.style.left = activeProduct.printArea.left;
            designEl.style.width = activeProduct.printArea.width;
            designEl.style.height = activeProduct.printArea.height;
        }

        // 3. Render Canvas và TỰ ĐỘNG LƯU ảnh lên Server
        renderMockupToCanvas(activeProduct, (dataUrl) => {
            console.log("⏳ Đang tự động lưu Mockup lên server...");
            
            fetch("/api/save-mockup", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ image_base64: dataUrl })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    console.log(`✅ Tự động lưu thành công (${activeProduct.name}):`, data.url);
                }
            })
            .catch(err => console.error("❌ Lỗi tự động lưu mockup:", err));
        });
      }
      function renderMockupToCanvas(product, callback) {
        const SIZE    = 800;
        const ZOOM    = 1.35;
        const scaled  = SIZE * ZOOM;          
        const off     = (SIZE - scaled) / 2;  

        const canvas  = document.createElement("canvas");
        canvas.width  = SIZE;
        canvas.height = SIZE;
        const ctx = canvas.getContext("2d");

        ctx.beginPath();
        ctx.rect(0, 0, SIZE, SIZE);
        ctx.clip();

        const baseImg = new Image();
        baseImg.crossOrigin = "anonymous";
        baseImg.onload = function () {
          // 1. Vẽ nguyên cảnh vật + áo gốc
          ctx.globalCompositeOperation = "source-over";
          ctx.drawImage(baseImg, off, off, scaled, scaled);

          // 2. Tải và vẽ Design AI
          const designImg = new Image();
          designImg.crossOrigin = "anonymous";
          designImg.onload = function () {
            const p    = (v) => parseFloat(v) / 100;
            const top  = off + p(product.printArea.top)  * scaled;
            const left = off + p(product.printArea.left) * scaled;
            const w    = p(product.printArea.width)  * scaled;
            const h    = p(product.printArea.height) * scaled;

            // Dùng 'screen' để tự động khử nền đen của design AI
            ctx.globalCompositeOperation = "screen"; 
            ctx.drawImage(designImg, left, top, w, h);
            
            callback(canvas.toDataURL("image/png"));
          };
          designImg.onerror = () => callback(canvas.toDataURL("image/png"));
          designImg.src = currentMockupDesignUrl;
        };
        baseImg.onerror = () => callback(canvas.toDataURL("image/png"));
        baseImg.src = product.base;
      }
      // ===================== END MOCKUP PAGE LOGIC =====================
    </script>

    <!-- ==================== MOCKUP PAGE ==================== -->
    <div id="mockup-page">
      <div class="mockup-header">
        <button class="mockup-back-btn" onclick="closeMockupPage()">
          ← Quay lại
        </button>
        <h2>👕 Xem thử thiết kế</h2>
      </div>

      <div class="mockup-preview-section" id="mockup-preview-section">
        <h3 id="mockup-preview-title" style="font-size: 16px; color: #00f5d4">
          Đang tải...
        </h3>

        <div
          class="mockup-preview-wrap"
          id="mockup-preview-wrap"
          style="overflow: hidden; border-radius: 16px"
        >
          <div
            id="mockup-zoom-layer"
            style="
              position: relative;
              width: 100%;
              height: 100%;
              transform: scale(1.35);
              transform-origin: center;
            "
          >
            <div class="preview-color-layer" id="mockup-color-layer"></div>
            <img class="preview-base" id="mockup-preview-base" src="" alt="" />
            <img
              class="preview-design"
              id="mockup-preview-design"
              src=""
              alt=""
            />
          </div>
        </div>
      </div>

      <h4
        style="
          margin-bottom: 12px;
          width: 100%;
          max-width: 600px;
          font-size: 14px;
          color: #aaa;
        "
      >
        Đổi sang sản phẩm khác:
      </h4>
      <div class="mockup-products-grid" id="mockup-grid"></div>
    </div>
    <!-- ==================== END MOCKUP PAGE ==================== -->
  </body>
</html>
